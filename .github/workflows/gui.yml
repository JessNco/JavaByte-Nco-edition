# Builds and checks the desktop app (gui/). Separate from the emulator's CI so that a change to
# one does not wait for the other.
name: GUI

on:
  push:
    # The GUI drives the command-line tool, so changes to the tool are tested here too.
    paths: ['gui/**', 'src/**', 'pom.xml', '.github/workflows/gui.yml']
  pull_request:
    paths: ['gui/**', 'src/**', 'pom.xml', '.github/workflows/gui.yml']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-24
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: gui
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            at-spi2-core python3-pyatspi xvfb dbus-x11
      # The runner tests drive the real command-line tool on harmless fixtures, so the tool and
      # its compiled test classes are built first.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the command-line tool
        working-directory: .
        run: mvn --batch-mode --no-transfer-progress -q package -DskipTests
      # The jar's name comes from version.sh, which also fails here if pom.xml, tauri.conf.json
      # and Cargo.toml disagree, so no version is written into this file.
      - name: Find the command-line tool's jar
        shell: bash
        working-directory: .
        run: echo "JAVABYTE_JAR=$GITHUB_WORKSPACE/target/javabyte-$(gui/packaging/version.sh).jar" >> "$GITHUB_ENV"
      - name: Install Trunk
        run: cargo install --locked trunk@0.22.1
      # The desktop app embeds the built screens, so its tests run after they are built
      # (step "Configuration and guard tests" below).
      - name: Unit, format and runner tests
        env:
          JAVABYTE_TEST_CLASSES: ${{ github.workspace }}/target/test-classes
          JAVABYTE_RUNNER_TESTS_REQUIRED: '1'
        run: cargo test -p javabyte-gui-protocol -p javabyte-gui-backend
      - name: Build the screens
        working-directory: gui/ui
        run: trunk build --release
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Accessibility checks in Chromium
        working-directory: gui/tests/a11y
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium
          node run.mjs ../../ui/dist
          node criteria.mjs ../../ui/dist
      - name: Build the desktop app
        run: cargo build --release -p javabyte-gui
      - name: Configuration and guard tests
        run: cargo test -p javabyte-gui
      # Lints keep the code easy to change; missing documentation in protocol and backend is
      # one of them. Runs after the screens are built, because the app embeds them.
      - name: Lints
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy -p javabyte-gui-ui --target wasm32-unknown-unknown -- -D warnings
      # Goes through a whole analysis of a harmless test fixture, pressing buttons through the
      # bus as a screen reader would. The app finds the tool's jar next to the repository.
      - name: Accessibility bus check (WebKitGTK)
        run: |
          jar --create --file "$RUNNER_TEMP/http-rat.jar" --main-class dev.javabyte.guest.sim.HttpRat \
            -C ../target/test-classes dev/javabyte/guest/sim/HttpRat.class
          PYTHON=/usr/bin/python3 tests/atspi/run.sh "$PWD/target/release/javabyte-gui" --sample "$RUNNER_TEMP/http-rat.jar" --print
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: javabyte-gui-linux-x86_64
          path: gui/target/release/javabyte-gui
      # Hostile script inside the real window, in a private network whose only network is a
      # fake DNS server and logging listeners. The control build has every protection removed
      # and must leak, or the clean result of the real build would prove nothing.
      - name: Build the egress probe and its control
        run: |
          cargo build --release -p javabyte-gui --features egress-probe
          cp target/release/javabyte-gui "$RUNNER_TEMP/probe"
          TAURI_CONFIG='{"app":{"security":{"csp":null},"windows":[{"label":"main","title":"JavaByte"}]}}' \
            cargo build --release -p javabyte-gui --features egress-control
          cp target/release/javabyte-gui "$RUNNER_TEMP/control"
      # The judge must fail a run whose fake network was broken, or a leak could pass unseen.
      - name: Egress judge tests
        run: python3 -I tests/egress/test_check.py
      - name: Egress test (must leak nothing)
        run: sudo tests/egress/run.sh "$RUNNER_TEMP/probe"
      - name: Egress control (must leak)
        run: sudo tests/egress/run.sh "$RUNNER_TEMP/control" expect-leaks

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch, 2026-11-24
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: gui
      # The runner tests drive the real command-line tool on harmless fixtures, so the tool and
      # its compiled test classes are built first.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the command-line tool
        working-directory: .
        run: mvn --batch-mode --no-transfer-progress -q package -DskipTests
      # The jar's name comes from version.sh, which also fails here if pom.xml, tauri.conf.json
      # and Cargo.toml disagree, so no version is written into this file.
      - name: Find the command-line tool's jar
        shell: bash
        working-directory: .
        run: echo "JAVABYTE_JAR=$GITHUB_WORKSPACE/target/javabyte-$(gui/packaging/version.sh).jar" >> "$GITHUB_ENV"
      - name: Install Trunk
        run: cargo install --locked trunk@0.22.1
      - name: Unit, format and runner tests
        env:
          JAVABYTE_TEST_CLASSES: ${{ github.workspace }}/target/test-classes
          JAVABYTE_RUNNER_TESTS_REQUIRED: '1'
        run: cargo test -p javabyte-gui-protocol -p javabyte-gui-backend
      # The sandbox add-on's isolation code exists only on Windows, so it is linted and its unit
      # tests run here (its end-to-end tests are in the Installers workflow).
      - name: Sandbox add-on lints and tests
        run: |
          cargo clippy -p javabyte-sandbox --all-targets -- -D warnings
          cargo test -p javabyte-sandbox
      - name: Build the screens
        working-directory: gui/ui
        run: trunk build --release
      - name: Build the desktop app
        run: cargo build --release -p javabyte-gui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: javabyte-gui-windows-x86_64
          path: gui/target/release/javabyte-gui.exe
      # The same probe on WebView2. There is no private network here, so only connections and
      # UDP to local listeners can be observed, not name lookups; the Linux job covers those.
      - name: Build the egress probe and its control
        shell: pwsh
        run: |
          cargo build --release -p javabyte-gui --features egress-probe
          Copy-Item target/release/javabyte-gui.exe "$env:RUNNER_TEMP/probe.exe"
          $env:TAURI_CONFIG = '{"app":{"security":{"csp":null},"windows":[{"label":"main","title":"JavaByte"}]}}'
          cargo build --release -p javabyte-gui --features egress-control
          Copy-Item target/release/javabyte-gui.exe "$env:RUNNER_TEMP/control.exe"
      - name: Egress test and control
        shell: pwsh
        run: |
          function Probe($exe, $mode) {
            $work = New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP ([IO.Path]::GetRandomFileName()))
            $listener = Start-Process python -ArgumentList "tests/egress/listener.py", "$work/network.log", "8099", "--no-dns" `
              -PassThru -RedirectStandardError "$work/listener.err"
            # Wait up to 10 s for the listener; check.py fails the run if it never got ready.
            for ($i = 0; $i -lt 100; $i++) {
              if ((Test-Path "$work/network.log") -and (Select-String -Quiet -Pattern '"ready"' -Path "$work/network.log")) { break }
              Start-Sleep -Milliseconds 100
            }
            $env:JAVABYTE_PROBE_PORT = "8099"
            $env:JAVABYTE_PROBE_REPORT = "$work/report.json"
            $started = Get-Date
            $app = Start-Process $exe -PassThru -RedirectStandardError "$work/app.log"
            if (-not $app.WaitForExit(120000)) { $app.Kill() }
            Write-Host "App ran for $([int]((Get-Date) - $started).TotalSeconds) s, exit code $($app.ExitCode)"
            # A listener that died during the run saw nothing after that, so check.py fails it.
            if ($listener.HasExited) { Add-Content "$work/network.log" '{"time": 0, "kind": "listener-exited"}' }
            Stop-Process -Id $listener.Id -ErrorAction SilentlyContinue
            Write-Host "--- listener errors"; Get-Content "$work/listener.err" -ErrorAction SilentlyContinue
            Write-Host "--- app log"; Get-Content "$work/app.log" -ErrorAction SilentlyContinue
            python tests/egress/check.py "$work" $mode
            if ($LASTEXITCODE -ne 0) { throw "egress check failed for $exe" }
          }
          Probe "$env:RUNNER_TEMP/probe.exe" "expect-none-without-dns"
          Probe "$env:RUNNER_TEMP/control.exe" "expect-leaks-without-dns"
