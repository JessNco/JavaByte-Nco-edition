[package]
name = "javabyte-gui-ui"
description = "The JavaByte GUI's screens, compiled to WebAssembly with Trunk"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
javabyte-gui-protocol.workspace = true
# Used only when the screens run in a plain browser (automated accessibility tests), where
# there is no desktop backend to ask. The desktop app never takes this path.
javabyte-gui-backend.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.8.23", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "HtmlInputElement", "Storage", "Window", "CssStyleDeclaration", "FocusEvent", "KeyboardEvent"] }
