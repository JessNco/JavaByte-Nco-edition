# A version tag (v0.2.0) builds both editions for Windows and Linux, tests them as on every
# push, writes SHA256SUMS, signs it with the project's GPG key, and creates a DRAFT release with
# everything. A person reviews the draft and publishes it. Without a usable signing key the
# workflow fails and no release is made: there are no unsigned releases. See
# docs/gui/RELEASING.md.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The tag matches every version in the repository
        run: gui/packaging/version.sh "$GITHUB_REF_NAME"

  # Before an hour of building: the signing key is stored, its passphrase works, and it is the
  # key whose public half is in the repository and whose fingerprint docs/INSTALL.md shows.
  signing-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The signing key is stored and is the documented one
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: gui/packaging/sign-checksums.sh check

  installers:
    needs: [versions, signing-key]
    uses: ./.github/workflows/installers.yml
    with:
      bridge: true

  draft:
    needs: installers
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: installers-*
          path: release
          merge-multiple: true
      - name: Checksums
        working-directory: release
        run: sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      # The key and its passphrase reach the script through the environment and go to gpg
      # through pipes, never on a command line. The script fails, and with it the release, if
      # the key is missing or is not the one in docs/javabyte-signing-key.asc; it verifies the
      # signature with that committed file alone. The public key is not added to the release:
      # a key that arrives with the files it signs proves nothing.
      - name: Sign the checksums
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: gui/packaging/sign-checksums.sh sign release/SHA256SUMS
      - name: Nothing is released unsigned
        run: test -s release/SHA256SUMS.asc
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          {
            echo "JavaByte $version for Windows and Linux. Installing and checking a download: see docs/INSTALL.md."
            echo
            echo "| Download | For |"
            echo "| --- | --- |"
            echo "| JavaByte-$version-windows-x86_64.msi | Windows 10 and 11 |"
            echo "| JavaByte-$version-windows-x86_64-portable.zip | Windows, without installing |"
            echo "| JavaByte-$version-linux-x86_64.deb | Ubuntu 22.04 and later, Debian 12 and later |"
            echo "| JavaByte-$version-linux-x86_64.AppImage | Other Linux systems, without installing (no network isolation on Ubuntu 24.04) |"
            echo "| JavaByte-$version-windows-x86_64-sandbox-addon.msi (and .zip for the portable edition) | Windows: run each analysis with no network, in an AppContainer or Windows Sandbox |"
            echo
            echo "Files ending in -with-native-bridge also analyse a sample's Windows native libraries (DLLs). They are larger."
            echo
            echo "The Windows installer is not signed yet, so Windows SmartScreen will warn when you run it."
            echo "docs/INSTALL.md shows what you will see and how to check the file first."
            echo
            echo "SHA256SUMS lists the checksum of every file and is signed (SHA256SUMS.asc). The public key is"
            echo "not part of this release on purpose: take it from docs/javabyte-signing-key.asc in the"
            echo "repository and compare its fingerprint with the one in docs/INSTALL.md."
            echo
            # The changelog's section for this version, or "Unreleased" if it has none yet.
            heading="$(grep -m1 -E "^## \[?$version\]?( |$)" CHANGELOG.md || echo "## Unreleased")"
            awk -v h="$heading" '$0 == h {on = 1; next} on && /^## / {exit} on' CHANGELOG.md
          } > notes.md
          cat notes.md
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "JavaByte ${GITHUB_REF_NAME#v}" --notes-file notes.md release/*
