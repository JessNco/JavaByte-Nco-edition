[package]
name = "javabyte-gui-backend"
description = "The JavaByte GUI's non-visual logic: event storage, filtering, run tracking"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
javabyte-gui-protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
yaml-edit = { version = "0.3.6", default-features = false }

[dev-dependencies]
serde_yaml = "0.9"

# Reading and saving files a sample produced: only in the desktop app, never in the screens.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sha2 = "0.10"
zip = { version = "9", default-features = false, features = ["aes-crypto", "deflate"] }
