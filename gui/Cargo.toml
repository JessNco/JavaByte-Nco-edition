# The JavaByte desktop interface. See docs/GUI-PLAN.md for the design.
#
# Crates: protocol (data shared by screens and backend, text resources), backend (everything
# that is not drawing: running the tool, settings, reports), app (the Tauri window and the
# commands the screens may call), ui (the screens, built to WebAssembly). See README.md here.
[workspace]
resolver = "3"
members = ["crates/protocol", "crates/backend", "app", "ui"]
# The screens compile to WebAssembly with Trunk, not with a plain `cargo build`.
default-members = ["crates/protocol", "crates/backend", "app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.85"

[workspace.dependencies]
javabyte-gui-protocol = { path = "crates/protocol" }
javabyte-gui-backend = { path = "crates/backend" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
# Small WebAssembly and a fast native binary; the GUI has no hot loops worth unwinding for.
lto = true
codegen-units = 1
opt-level = "s"
panic = "abort"

[profile.dev.package."*"]
# Dependencies optimised even in debug builds, so the event grid's speed in development is
# representative of a release build.
opt-level = 2
