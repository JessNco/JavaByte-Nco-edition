# Builds and tests on every supported Java version. The tests need no network and no samples:
# the real-malware scenarios are skipped here on purpose (docs/TESTING.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Oldest supported release, the release used for development, and the newest LTS.
        java: ['17', '21', '25']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      # Actions are used by commit, never by a tag or branch that could later point elsewhere.
      - name: Every action is pinned to a commit
        if: matrix.java == '21'
        run: scripts/check-action-pins.sh
      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress verify
      # The isolated launcher must run the jar of the version in pom.xml, not an older one left
      # in target/. The check uses stand-ins for Java, so one Java version is enough.
      - name: Launcher picks the right jar
        if: matrix.java == '21'
        run: scripts/test-run-isolated.sh
      # One copy of the coverage report is enough; it does not differ meaningfully by Java version.
      - name: Keep the coverage report
        if: matrix.java == '21'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-report
          path: target/site/jacoco/

  # The optional native bridge needs Python packages, so it is tested in its own job. The main
  # job above stays free of anything but Java.
  native-bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Create the bridge environment
        run: scripts/setup-native-bridge.sh "$RUNNER_TEMP/bridge-venv"
      - name: Run the bridge tests
        env:
          JAVABYTE_BRIDGE_PYTHON: ${{ runner.temp }}/bridge-venv/bin/python
        run: mvn --batch-mode --no-transfer-progress verify -Dtest=NativeBridgeTest -Dsurefire.failIfNoSpecifiedTests=false
