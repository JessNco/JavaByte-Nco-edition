[package]
name = "javabyte-gui"
description = "JavaByte desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Serve the screens from the files built into the binary. `cargo tauri dev` turns this off to
# use a development server instead; a plain `cargo build` keeps it on, so the result is the
# real, self-contained app.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
# Test only: runs hostile JavaScript inside the window to try every way of sending data out,
# for tests/egress. Never enable it in a build meant for people.
egress-probe = []
# Test only: the control build for tests/egress, with the navigation guard and WebRTC removal
# switched off, to prove the harness notices leaks. Never enable it in a build meant for people.
egress-control = ["egress-probe"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
javabyte-gui-protocol.workspace = true
javabyte-gui-backend.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2.12", features = [] }
# The system's own file picker, opened from Rust. The screens cannot call it directly: the
# window's capabilities grant no plugin permissions.
tauri-plugin-dialog = "2.8"
# The data and documents folders for `--self-check`, which runs without a window. Tauri uses
# the same crate for its own paths.
dirs = "7"
